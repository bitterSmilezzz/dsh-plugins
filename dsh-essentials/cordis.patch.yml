# dsh-essentials — 组合包层（2026-08-16 由 5 个插件合并而来，2026-08-18 拆分）
#
# 剩余子插件（model-selector / paste-input / at-file）合并为单个 entry：
# host 半区 = lib/index.js（组合 apply），浏览器半区 = lib/client.js（各 factory 提取后
# 统一 apply），共享同一 fiber。
#
# 已拆出为独立 bundle：
# - visualize + vision-bridge → dsh-visualize
# - auto-hide-composer + immersive-mode + keyboard-shortcuts + retry-settings +
#   plugin-inventory → dsh-ui-tweaks
#
# host inject 为剩余子模块的并集（fs/webServer/loader/sessions/settings/typert），
# 保证 apply 时硬依赖全部就绪。
#
# 注意：inject 项是 Cordis 服务名（非 entry id）。
#
# 可选 config（按 id 覆盖）：
#   essentials:
#     config:
#       atFile: { enabled: true }
#       visualize: { maxFragmentBytes: 1000000 }
#
# Install:   dsh plugin --profile <profile> add <path-or-github>
#
# 官方只读「插件列表」UI（id: ui-settings-plugin-inventory）由本包替换：
# 我们注册同 id `all` 的增强 tab（分类）。若不禁用官方 entry，
# tab 列表会同时出现两个「插件列表」。这里直接禁用官方 UI，保留其 host
# 数据源 `plugin-inventory`。

- id: ui-settings-plugin-inventory
  disabled: true

# ── 无损省 token（内置）────────────────────────────────────────────
# 目标：在不丢失信息的前提下减少常驻上下文。完整内容仍可通过 spill 文件
# 或分页读取按需取回，因此对生成质量/效果无影响。
#
# 1) shell 输出内联只保留尾部，完整输出 spill 到临时文件；
# 2) read 默认窗口变小，需要更多内容时用 offset/limit 分页；
# 3) 通用纯文本工具结果超过内联上限时，自动替换为 head/tail 预览 +
#    spill 文件路径。
#
# 用户可在 profile 的 cordis.patch.yml 按行 id 覆盖这些值（最后写入者生效）。

- id: pwsh-sandbox
  config:
    maxOutputBytes: 16384
    maxSpillBytes: 1048576

- id: bash-sandbox
  config:
    maxOutputBytes: 16384
    maxSpillBytes: 1048576

- id: tool-fs
  config:
    readLimit: 500
    readMaxBytes: 16384
    readMaxLineLength: 2000

- id: spill-policy
  config:
    maxInlineBytes: 16384

- insert:
    - id: essentials
      name: dsh-essentials
      inject:
        - fs
        - webServer
        - loader
        - sessions
        - settings
        - typert
