name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验脚本自检
        run: |
          node --check scripts/validate-plugin.mjs
          node scripts/validate-plugin.mjs . --json >/dev/null && echo "validate-plugin 可运行"

      - name: Settings apply dry-run
        run: node scripts/apply-settings.mjs --dry-run --settings /tmp/nonexistent-settings.yaml

      - name: External manifest dry-run
        run: node scripts/install-external.mjs --dry-run
