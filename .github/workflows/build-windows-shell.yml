# Build the Windows Tauri shell and ship it inside the plugin bundle.
#
# The plugin installs via `dsh plugin add github:...#path:/dsh-desktop-shell` and
# the host reads `native/build/DeepSeekHarness.exe`, so the built binary must
# live in the repo. This workflow rebuilds it on every Tauri change and commits
# the fresh exe. A Windows machine cannot be cross-built from macOS, hence the
# dedicated windows-latest runner.
#
# Manual trigger:
#   GitHub → Actions → "build-windows-shell" → Run workflow
#   (or just push a change under dsh-desktop-shell/tauri/)

name: build-windows-shell

on:
  workflow_dispatch:
  push:
    paths:
      - 'dsh-desktop-shell/tauri/**'
      - '.github/workflows/build-windows-shell.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: dsh-desktop-shell/tauri/src-tauri

      - name: Build Tauri shell (release)
        working-directory: dsh-desktop-shell/tauri/src-tauri
        run: cargo build --release

      - name: Copy exe into the plugin bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dsh-desktop-shell/native/build | Out-Null
          Copy-Item dsh-desktop-shell/tauri/src-tauri/target/release/dsh-desktop.exe `
            dsh-desktop-shell/native/build/DeepSeekHarness.exe -Force
          Get-Item dsh-desktop-shell/native/build/DeepSeekHarness.exe | Select-Object Length, LastWriteTime

      - name: Commit the fresh binary
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'build(mac-desktop): refresh Windows Tauri shell binary'
          file_pattern: dsh-desktop-shell/native/build/DeepSeekHarness.exe
          skip_fetch: true
