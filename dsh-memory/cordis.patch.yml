# dsh-memory — 独立记忆 bundle
#
# 从 dsh-essentials 拆出的独立包。安装后自动插入 host entry（id: dsh-memory），
# 浏览器半区由 `dsh.client` 声明自动加载。
#
# Install:   dsh plugin --profile <profile> add <path-or-github>
- insert:
    - id: dsh-memory
      name: 'dsh-memory'
      inject:
        - fs
        - webServer
        - tools
